name: fareline

x-spark-image: &spark-image
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: fareline-spark:4.1.0-m0.1

x-spark-volumes: &spark-volumes
  - fareline-data:/opt/fareline/data
  - fareline-output:/opt/fareline/output
  - fareline-warehouse:/opt/fareline/warehouse
  - fareline-spark-events:/opt/fareline/spark-events

services:
  spark-master:
    <<: *spark-image
    mem_limit: "${FARELINE_MASTER_CONTAINER_MEMORY_LIMIT:-4g}"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; socket.create_connection(('spark-master', 7077), 2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
    volumes: *spark-volumes
    networks: [fareline]

  spark-worker:
    <<: *spark-image
    mem_limit: "${FARELINE_WORKER_CONTAINER_MEMORY_LIMIT:-3g}"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${FARELINE_WORKER_CORES:-2}"
      - --memory
      - "${FARELINE_WORKER_MEMORY:-2g}"
    depends_on:
      spark-master:
        condition: service_healthy
    volumes: *spark-volumes
    networks: [fareline]

networks:
  fareline:
    driver: bridge

volumes:
  fareline-data:
  fareline-output:
  fareline-warehouse:
  fareline-spark-events:
