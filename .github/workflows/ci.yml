name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build Spark baseline
        run: docker compose build
      - name: Start standalone cluster
        run: docker compose up -d --scale spark-worker=2 --wait --wait-timeout 120
      - name: Verify Java, Spark, and package
        run: >-
          docker compose exec -T spark-master
          bash -lc 'java -version && /opt/spark/bin/spark-submit --version && python3 -c "import fareline; print(fareline.__version__)"'
      - name: Verify distributed shared storage
        run: >-
          docker compose exec -T spark-master
          /opt/spark/bin/spark-submit --master spark://spark-master:7077
          /opt/fareline/scripts/spark_storage_smoke.py
      - name: Clean up cluster and volumes
        if: always()
        run: docker compose down -v --remove-orphans
